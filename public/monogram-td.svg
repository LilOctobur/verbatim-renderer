<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#F2EBE3"/>

  <!-- Top motif: small floral/sparkle cluster -->
  <g transform="translate(200,95)" fill="#1A1A1A">
    <!-- four-petal sparkle -->
    <path d="M0,-14 C2,-6 2,-6 10,-4 C2,-2 2,-2 0,6 C-2,-2 -2,-2 -10,-4 C-2,-6 -2,-6 0,-14 Z"/>
    <!-- small dot left -->
    <circle cx="-22" cy="4" r="2.5"/>
    <!-- small dot right -->
    <circle cx="22" cy="4" r="2.5"/>
  </g>

  <!-- Monogram -->
  <text x="200" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="110"
        letter-spacing="8" text-anchor="middle" fill="#1A1A1A">TD</text>

  <!-- Bottom motif: small sparkle cluster, slightly different arrangement -->
  <g transform="translate(200,300)" fill="#1A1A1A">
    <path d="M0,-10 C1.5,-4 1.5,-4 7,-2.5 C1.5,-1 1.5,-1 0,5 C-1.5,-1 -1.5,-1 -7,-2.5 C-1.5,-4 -1.5,-4 0,-10 Z"/>
    <circle cx="-16" cy="3" r="2"/>
    <circle cx="16" cy="3" r="2"/>
    <circle cx="0" cy="14" r="1.5"/>
  </g>
</svg>
